services:
  maid-bot:
    build: .
    container_name: khammee-khammmaid
    init: true
    restart: unless-stopped
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN:?Set DISCORD_TOKEN in .env}
      CLIENT_ID: ${CLIENT_ID:?Set CLIENT_ID in .env}
      GUILD_ID: ${GUILD_ID:?Set GUILD_ID in .env}
      DATABASE_URL: file:/data/cafe.db
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_CHANNEL_ID: ${LOG_CHANNEL_ID:-}
      OWNER_ID: ${OWNER_ID:-}
      AI_API_KEY: ${AI_API_KEY:-}
    volumes:
      - cafe-data:/data

volumes:
  cafe-data:
